# Configuración de SonarQube para el proyecto Valle Grande

# Información del proyecto
sonar.projectKey=vallegrande-project
sonar.projectName=Valle Grande - Proyecto Base
sonar.projectVersion=1.0

# Rutas del código fuente
sonar.sources=src/main/java
sonar.java.binaries=target/classes

# Codificación del código fuente
sonar.sourceEncoding=UTF-8

# Lenguaje del proyecto
sonar.language=java

# Exclusiones (archivos que no se analizarán)
sonar.exclusions=**/target/**,**/test/**

# Configuración de Java
sonar.java.source=11
